name: mirror-to-gitee

# 可选：把仓库镜像到 Gitee
#   必填 Secrets：GITEE_USERNAME、GITEE_TOKEN（Gitee 私人令牌，勾选 projects 权限）
#   可选 Variable：GITEE_REPO（默认 luci-app-menusort）
# 未配置时本工作流直接跳过，不会失败。

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          set -eu
          [ -n "${GITEE_USER}" ] || { echo "未配置 GITEE_USERNAME，跳过"; exit 0; }
          [ -n "${GITEE_TOKEN}" ] || { echo "未配置 GITEE_TOKEN，跳过"; exit 0; }
          [ -n "${GITEE_REPO:-}" ] || GITEE_REPO="luci-app-menusort"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git"
          git push gitee "HEAD:refs/heads/main" --force
          git push gitee --tags --force
          echo "已镜像到 gitee.com/${GITEE_USER}/${GITEE_REPO}"
