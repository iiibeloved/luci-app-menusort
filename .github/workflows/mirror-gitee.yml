name: mirror-to-gitee

# 可选：把仓库镜像到 Gitee（需要在仓库 Secrets 里配置 GITEE_USERNAME / GITEE_TOKEN）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 Gitee
        if: ${{ secrets.GITEE_USERNAME != '' && secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'luci-app-menusort' }}
        run: |
          set -eu
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git"
          git push gitee "HEAD:refs/heads/main" --force
          git push gitee --tags --force
